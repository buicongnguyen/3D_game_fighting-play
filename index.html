<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081115" />
    <meta
      name="description"
      content="KITEFALL. A kite-wing commando rescue across four seasons of an occupied mountain valley. Leave no one behind."
    />
    <title>KITEFALL — Leave no one behind</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%233fe0c5' d='M20 2 38 26 20 19 2 26Z'/%3E%3Cpath stroke='%23ffb547' stroke-width='2' fill='none' d='m20 19-3 15 7 4'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-DRJg_4jB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-hTZ_BvmT.css">
  </head>
  <body>
    <canvas id="game" aria-label="KITEFALL 3D game world"></canvas>
    <div class="screen-vignette"></div>

    <div id="loading" class="loading-screen">
      <svg class="logo-kite" viewBox="0 0 100 90" aria-hidden="true">
        <path d="M50 3 97 64 50 46 3 64Z" />
        <path class="line" d="M50 46 43 73 57 85" />
      </svg>
      <h1 class="logotype" data-no-translate>KITE<span>FALL</span></h1>
      <p id="load-label">Establishing uplink</p>
      <div class="load-track"><i id="load-progress"></i></div>
      <span id="load-percent">0%</span>
    </div>

    <main id="menu" class="hidden" aria-live="polite"></main>

    <div id="hud" class="hidden">
      <section class="hud-objective" aria-label="Current objective">
        <small id="focus-phase"></small>
        <b id="focus-title"></b>
        <span id="focus-route"
          ><i id="focus-arrow" aria-hidden="true"
            ><svg viewBox="0 0 32 32">
              <path d="M16 2 29 18 20 16 20 30 12 30 12 16 3 18Z" /></svg></i
          ><strong id="focus-distance"></strong><em id="focus-route-text"></em
        ></span>
        <p id="focus-hint"></p>
        <div id="train-hud" class="hud-train hidden">
          <b id="train-distance"></b><span id="train-status"></span>
        </div>
        <div id="radio-call" class="radio-call hidden" role="status">
          <b id="radio-countdown"></b>
        </div>
      </section>

      <section class="hud-compass" aria-label="Compass">
        <div class="compass-strip"><div id="compass-ticks"></div><i id="compass-objective"></i></div>
        <b id="heading">000</b>
        <div class="detection" id="detection-meter" role="meter" aria-label="Enemy detection" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="detection-fill"></i>
        </div>
        <small id="alert-label"></small>
        <section id="boss-hud" class="boss-hud hidden" aria-label="Priority target">
          <div><b id="boss-name"></b><small id="boss-phase"></small></div>
          <div class="boss-track"><i id="boss-health"></i></div>
          <span id="boss-status"></span>
        </section>
      </section>

      <div id="mission-title" class="mission-title hidden" aria-live="polite"></div>
      <div id="toast" role="status" class="hidden"></div>
      <div id="killfeed" aria-live="polite"></div>
      <div id="checkpoint" class="hidden"></div>

      <div id="markers"></div>
      <div id="reticle" class="reticle"><i></i><b></b></div>
      <div id="hit-marker" class="hidden"></div>
      <div id="damage-overlay"></div>
      <div id="damage-arcs"></div>
      <div id="structure-hud" class="structure-hud hidden"></div>

      <div id="scope" class="hidden">
        <div class="scope-circle">
          <div class="scope-horizontal"></div>
          <div class="scope-vertical"></div>
          <span id="scope-label" class="scope-label"></span>
          <span id="scope-data"></span>
          <span id="scope-help" class="scope-bottom"></span>
        </div>
      </div>

      <div class="flight-readout" id="flight-readout">
        <b id="altitude">000</b><small>M</small>
        <span id="flight-status"></span>
      </div>

      <div id="interact" class="interact-prompt hidden" role="button" aria-keyshortcuts="E"></div>
      <div id="hint" class="control-hint hidden"></div>

      <section class="hud-vitals" aria-label="Health and map">
        <canvas id="minimap" width="200" height="200" aria-label="Tactical minimap"></canvas>
        <div class="vital-bars">
          <div class="vital health"><i id="health-bar"></i><b id="health-value">200</b></div>
          <div class="vital armor"><i id="armor-bar"></i><b id="armor-value">100</b></div>
        </div>
      </section>

      <section class="hud-weapon" aria-label="Weapon and abilities">
        <div class="abilities" id="abilities"></div>
        <div class="weapon-main">
          <small id="weapon-kind"></small>
          <b id="weapon-name"></b>
          <div class="ammo"><strong id="ammo">06</strong><span id="reserve">042</span></div>
          <span id="reload-state"></span>
        </div>
        <div id="weapon-slots"></div>
      </section>

      <div id="touch-controls" aria-label="Touch controls">
        <div id="touch-stick" aria-hidden="true"><span id="stick-knob"></span></div>
        <div class="touch-top">
          <button data-touch="map" aria-label="Map and objectives">Map</button>
          <button data-touch="pause" aria-label="Pause">Pause</button>
        </div>
        <div class="touch-cluster">
          <button data-touch="fire" id="touch-fire" class="big">Fire</button>
          <button data-touch="aim" id="touch-aim">Aim</button>
          <button data-touch="jump" id="touch-jump">Jump</button>
          <button data-touch="crouch" id="touch-crouch">Crouch</button>
          <button data-touch="kite" id="touch-kite">Kite</button>
          <button data-touch="reload" id="touch-reload">Reload</button>
          <button data-touch="interact" id="touch-use" class="use hidden">Use</button>
          <button data-touch="zoomOut" id="touch-zoom-out" class="zoom hidden" aria-label="Zoom out">−</button>
          <button data-touch="zoomIn" id="touch-zoom-in" class="zoom hidden" aria-label="Zoom in">+</button>
        </div>
        <div class="touch-row">
          <button data-touch="weaponNext" id="touch-weapon">Weapon</button>
          <button data-touch="sprint" id="touch-sprint">Sprint</button>
          <button data-touch="recon" id="touch-recon">Recon</button>
          <button data-touch="thermal" id="touch-heat" aria-pressed="false">Heat</button>
          <button data-touch="medkit" id="touch-medkit">Medkit</button>
        </div>
      </div>
    </div>

    <div id="subtitles" aria-live="polite"></div>

    <div id="overlay" class="hidden">
      <section id="panel" role="dialog" aria-modal="true" aria-label="Menu"></section>
    </div>

    <section id="extraction-cinematic" class="hidden" aria-label="Rescue flight">
      <div class="cinema-bar top"></div>
      <div class="cinema-bar bottom"></div>
      <div class="cinema-caption">
        <small id="cinema-chapter"></small>
        <h2 id="cinema-title">EVERYONE ABOARD</h2>
        <p id="cinema-text"></p>
      </div>
      <div class="cinema-actions">
        <button id="cinema-pause">Pause</button
        ><button id="cinema-skip">Skip to debrief</button>
      </div>
    </section>

    <section id="scenic-flight" class="hidden" aria-label="Scenic flight">
      <div class="scenic-caption"><small id="scenic-season"></small><h2 id="scenic-title"></h2></div>
      <div class="scenic-toolbar">
        <progress id="scenic-progress" max="48" value="0" aria-label="Flight progress"></progress>
        <div class="scenic-buttons">
          <button id="scenic-pause" aria-keyshortcuts="P">Pause</button>
          <button id="scenic-replay">Replay</button>
          <button id="scenic-record">Record flight</button>
          <a id="scenic-download" class="hidden" data-nav download>Save video</a>
          <button id="scenic-back" aria-keyshortcuts="Escape">Back</button>
        </div>
        <p id="scenic-status" role="status"></p>
        <small class="scenic-shortcuts"><span>P · Pause / Resume</span> &nbsp; <span>Esc · Back</span></small>
      </div>
    </section>
    <div id="fatal" class="hidden" role="alert"></div>
  </body>
</html>
